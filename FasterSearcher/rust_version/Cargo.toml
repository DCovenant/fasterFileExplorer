[package]
name = "rust-index-p2-sql"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustIndexP2Sql"
path = "src/main.rs"

[dependencies]
walkdir = "2.4"
rusqlite = { version = "0.31", features = ["bundled"] }
rayon = "1.8"
indicatif = "0.17"
crossbeam-channel = "0.5"
memmap2 = "0.9"
num_cpus = "1.16"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
